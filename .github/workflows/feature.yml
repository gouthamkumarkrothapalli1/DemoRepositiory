name: Feature Pipeline

on:
  workflow_dispatch:

jobs:
  export-solution:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Authenticate to Power Platform
        uses: microsoft/powerplatform-actions/authenticate@v1
        with:
          app-id: ${{ secrets.POWERPLATFORM_APP_ID }}
          client-secret: ${{ secrets.POWERPLATFORM_CLIENT_SECRET }}
          tenant-id: ${{ secrets.POWERPLATFORM_TENANT_ID }}
          url: ${{ secrets.DEV_ENV_URL }}

      - name: Export Unmanaged Solution
        run: |
          pac solution export \
            --name TestDemo \
            --path TestDemo.zip \
            --managed false

      - name: Create Solution Folder
        run: |
          mkdir -p Solutions/Unmanaged/TestDemo

      - name: Unpack Solution
        run: |
          pac solution unpack \
            --zipfile TestDemo.zip \
            --folder Solutions/Unmanaged/TestDemo \
            --packagetype Both

      - name: Commit Changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          git commit -m "Export latest TestDemo" || echo "No changes"

          git push origin ${{ github.ref_name }}
