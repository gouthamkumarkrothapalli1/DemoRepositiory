name: Feature Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-solution:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Check PAC Installation
        run: |
          echo "PAC Path: $POWERPLATFORMTOOLS_PACPATH"
          ls -la $(dirname $POWERPLATFORMTOOLS_PACPATH)
          $POWERPLATFORMTOOLS_PACPATH --version

      - name: Authenticate to Dataverse
        run: |
          $POWERPLATFORMTOOLS_PACPATH auth create \
            --applicationId "${{ secrets.POWERPLATFORM_APP_ID }}" \
            --clientSecret "${{ secrets.POWERPLATFORM_CLIENT_SECRET }}" \
            --tenant "${{ secrets.POWERPLATFORM_TENANT_ID }}" \
            --environment "${{ secrets.DEV_ENV_URL }}"

      - name: Verify Authentication
        run: |
          $POWERPLATFORMTOOLS_PACPATH auth list

      - name: Export Unmanaged Solution
        run: |
          $POWERPLATFORMTOOLS_PACPATH solution export \
            --name TestDemo \
            --path Solution.zip \
            --managed false

      - name: Create Solution Folder
        run: |
          mkdir -p Solutions/Unmanaged/TestDemo

      - name: Unpack Solution
        run: |
          $POWERPLATFORMTOOLS_PACPATH solution unpack \
            --zipfile Solution.zip \
            --folder Solutions/Unmanaged/TestDemo \
            --packagetype Both

      - name: Commit Changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          git commit -m "Export latest TestDemo solution" || echo "No changes detected"

          git push origin ${{ github.ref_name }}
