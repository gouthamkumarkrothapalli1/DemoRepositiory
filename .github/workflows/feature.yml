name: Feature Pipeline

on:
  pull_request:
    branches:
      - develop
    types:
      - closed

permissions:
  contents: write

jobs:
  export-solution:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Authenticate to Dataverse
        run: |
          $POWERPLATFORMTOOLS_PACPATH auth create \
            --applicationId "${{ secrets.POWERPLATFORM_APP_ID }}" \
            --clientSecret "${{ secrets.POWERPLATFORM_CLIENT_SECRET }}" \
            --tenant "${{ secrets.POWERPLATFORM_TENANT_ID }}" \
            --environment "${{ secrets.DEV_ENV_URL }}"

      - name: Export Unmanaged Solution
        run: |
          $POWERPLATFORMTOOLS_PACPATH solution export \
            --name TestDemo \
            --path TestDemo.zip \
            --managed false

      - name: Prepare Solution Folder
        run: |
          rm -rf Solutions/Unmanaged/TestDemo

          mkdir -p Solutions/Unmanaged/TestDemo
          mkdir -p Solutions/managed

          cp TestDemo.zip Solutions/Unmanaged/TestDemo_unmanaged.zip
          cp TestDemo_managed.zip Solutions/managed/TestDemo_managed.zip

      - name: Unpack Solution
        run: |
          $POWERPLATFORMTOOLS_PACPATH solution unpack \
            --zipfile TestDemo.zip \
            --folder Solutions/Unmanaged/TestDemo \
            --packagetype Unmanaged
      
      - name: Export Managed Solution
        run: |
          $POWERPLATFORMTOOLS_PACPATH solution export \
            --name TestDemo \
            --path TestDemo_managed.zip \
            --managed true
      
      - name: Commit Changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add Solutions/Unmanaged/TestDemo
          git add Solutions/Unmanaged/TestDemo_unmanaged.zip
          git add Solutions/managed/TestDemo_managed.zip

          git commit -m "Export latest TestDemo unmanaged solution" || echo "No changes Detected"

          git push origin develop

      - name: Clear Authentication
        run: |
          $POWERPLATFORMTOOLS_PACPATH auth clear
