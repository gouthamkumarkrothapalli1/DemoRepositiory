name: Feature Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-solution:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@v1

      # SOURCE ENVIRONMENT LOGIN
      - name: Authenticate Source Environment
        run: |
          $POWERPLATFORMTOOLS_PACPATH auth create \
            --applicationId "${{ secrets.POWERPLATFORM_APP_ID }}" \
            --clientSecret "${{ secrets.POWERPLATFORM_CLIENT_SECRET }}" \
            --tenant "${{ secrets.POWERPLATFORM_TENANT_ID }}" \
            --environment "${{ secrets.DEV_ENV_URL }}"

      - name: Export Unmanaged Solution
        run: |
          $POWERPLATFORMTOOLS_PACPATH solution export \
            --name TestDemo \
            --path TestDemo.zip \
            --managed false

      - name: Prepare Solution Folder
        run: |
          rm -rf Solutions/Unmanaged/TestDemo
          mkdir -p Solutions/Unmanaged/TestDemo

      - name: Unpack Solution
        run: |
          $POWERPLATFORMTOOLS_PACPATH solution unpack \
            --zipfile TestDemo.zip \
            --folder Solutions/Unmanaged/TestDemo \
            --packagetype Unmanaged

      - name: Commit Changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add Solutions/Unmanaged/TestDemo

          git commit -m "Export latest TestDemo unmanaged solution" || echo "No changes are detected"

          git push origin ${{ github.ref_name }}

      # CLEAR SOURCE AUTH
      - name: Clear Existing Auth
        run: |
          $POWERPLATFORMTOOLS_PACPATH auth clear

      # TARGET ENVIRONMENT LOGIN
      - name: Authenticate Target Environment
        run: |
          $POWERPLATFORMTOOLS_PACPATH auth create \
            --applicationId "${{ secrets.POWERPLATFORM_APP_ID }}" \
            --clientSecret "${{ secrets.POWERPLATFORM_CLIENT_SECRET }}" \
            --tenant "${{ secrets.POWERPLATFORM_TENANT_ID }}" \
            --environment "${{ secrets.DEV_ENV_URL }}"

          #$POWERPLATFORMTOOLS_PACPATH auth create \
          
           # --applicationId "${{ secrets.POWERPLATFORM_APP_ID }}" \
           # --clientSecret "${{ secrets.POWERPLATFORM_CLIENT_SECRET }}" \
           #--tenant "${{ secrets.POWERPLATFORM_TENANT_ID }}" \
           # --environment "${{ secrets.TARGET_ENV_URL }}"

      - name: Verify Target Authentication
        run: |
          $POWERPLATFORMTOOLS_PACPATH auth list

      # IMPORT UNMANAGED SOLUTION
      - name: Import Unmanaged Solution
        run: |
          $POWERPLATFORMTOOLS_PACPATH solution import \
            --path TestDemo.zip \
            --async

      - name: Publish All Customizations
        uses: microsoft/powerplatform-actions/publish-solution@v1
        with:   
            --applicationId "${{ secrets.POWERPLATFORM_APP_ID }}" \
            --clientSecret "${{ secrets.POWERPLATFORM_CLIENT_SECRET }}" \
            --tenant "${{ secrets.POWERPLATFORM_TENANT_ID }}" \
            --environment "${{ secrets.DEV_ENV_URL }}"
